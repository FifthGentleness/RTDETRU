# RT-DETR-r18 + DSAWACGAv5 backbone + HybridEncoderP2SPDOKMFSV7 encoder
#
# 方案三 HS-A (Anchor): S5 保留 AIFI_BlockSparse + P4 块稀疏交互 + 25 个 P5 块
# 摘要锚只读分支(Y5_up 固定 5x5 池化, 零新增投影参数; 1600x25 小 MHA 独立分支,
# 零初始化标量门 g_a => step-0 等价于方案一)。
#   - 与失败 RABSA 寄存器的边界: 锚点是真实 P5 特征(跨尺度/单向/不写回),
#     非同尺度可学习全局量; KV 占比 25/1600 ~= 1.6%
#   - 参数增量 ~1.05M; GFLOPs 增量与方案一相同(~+3.2G, 锚点分支开销可忽略)
# AIFI_HSB args: [cm=1024, num_heads=8, anchor_grid=5]
nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 1, C2f_DSAWACGA_v5, [128]]      # 2  P2: 128ch
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 1, C2f_DSAWACGA_v5, [256]]      # 4  P3: 256ch
  - [-1, 1, Conv, [384, 3, 2]]           # 5-P4/16
  - [-1, 1, C2f_DSAWACGA_v5, [384]]      # 6  P4: 384ch
  - [-1, 1, Conv, [384, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f_DSAWACGA_v5, [384]]      # 8  P5: 384ch

head:
  # P5: 384->256 (input_proj.2)
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9
  - [-1, 1, AIFI_BlockSparse, [1024, 8]]           # 10  S5 交互(冠军主干, 不改动)
  - [-1, 1, Conv, [256, 1, 1]]                     # 11, Y5

  # FPN: Y5_up + P4_proj -> RepC3 -> Y4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12  Y5_up
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13  P4: 384->256
  - [[12, 13], 1, AIFI_HSB, [1024, 8, 5]]          # 14  P4 块稀疏交互 + 25 P5 摘要锚
  - [[12, 14], 1, Concat, [1]]                     # 15  256+256=512 (CCFM 融合路径不变)
  - [-1, 3, RepC3, [256, 0.5]]                     # 16
  - [-1, 1, Conv, [256, 1, 1]]                     # 17, Y4: 256ch

  # CCFFP2V7: [P2(128ch), P3(256ch), Y4(256ch)] -> f3(256ch)
  - [[2, 4, 17], 1, CCFFP2V7, [256, 128]]          # 18  f3

  # PAN: f3->ds + Y4 -> f4
  - [-1, 1, Conv, [256, 3, 2]]                     # 19
  - [[-1, 17], 1, Concat, [1]]                     # 20  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 21  f4

  # PAN: f4->ds + Y5 -> f5
  - [-1, 1, Conv, [256, 3, 2]]                     # 22
  - [[-1, 11], 1, Concat, [1]]                     # 23  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 24  f5

  - [[18, 21, 24], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 25
