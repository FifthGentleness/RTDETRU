# RT-DETR-r18 + DSAWACGAv5 backbone + HybridEncoderP2SPDOKMFSV7 encoder
# + Focaler-InterpIoU bbox regression loss (innovation #3)
#
# loss_name: focaler_interpiou
#   Main term   : Dynamic InterpIoU  (Liu & Watanabe, Neurocomputing 2026)
#                 alpha = 1 - IoU (per-sample), L = (1-IoU) + (1-IoU(B_a, B_gt))
#   Aux term    : Focaler interval mapping, L = L_main + IoU - IoU_focaler
#                 IoU_f = clamp((IoU - d) / (u - d), 0, 1)
#                 (Focaler-IoU arXiv 2401.10525; RT-DETR small-target use in
#                  CAEM-DETR, IEEE TGRS 2025)
#   L1 / VFL / Hungarian matching / aux & denoising losses: unchanged
#
# Hyperparameters (small-object defaults):
#   focaler_d      = 0.35  : below this, aux gradient saturates and the
#                            interpolated D-InterpIoU term takes over;
#                            ablation grid {0.30, 0.35, 0.40}
#   focaler_u      = 0.80  : above this, aux term ~ 0, no fine-stage disturbance;
#                            ablation grid {0.75, 0.80, 0.85}
#   dynamic_interp = true  : D-InterpIoU main term; false -> static alpha (paper 0.99)
nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 1, C2f_DSAWACGA_v5, [128]]      # 2  P2: 128ch
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 1, C2f_DSAWACGA_v5, [256]]      # 4  P3: 256ch
  - [-1, 1, Conv, [384, 3, 2]]           # 5-P4/16
  - [-1, 1, C2f_DSAWACGA_v5, [384]]      # 6  P4: 384ch
  - [-1, 1, Conv, [384, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f_DSAWACGA_v5, [384]]      # 8  P5: 384ch

head:
  # P5: 384->256 (input_proj.2)
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9
  - [-1, 1, AIFI, [1024, 8]]                       # 10
  - [-1, 1, Conv, [256, 1, 1]]                     # 11, Y5

  # FPN: Y5_up + P4_proj -> RepC3 -> Y4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13  P4: 384->256
  - [[-2, -1], 1, Concat, [1]]                     # 14  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 15
  - [-1, 1, Conv, [256, 1, 1]]                     # 16, Y4: 256ch

  # CCFFP2V7: [P2(128ch), P3(256ch), Y4(256ch)] -> f3(256ch)
  # spd_out_ch=128: SPDConv outputs 128 instead of default 256
  - [[2, 4, 16], 1, CCFFP2V7, [256, 128]]          # 17  f3

  # PAN: f3->ds + Y4 -> f4
  - [-1, 1, Conv, [256, 3, 2]]                     # 18
  - [[-1, 16], 1, Concat, [1]]                     # 19  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 20  f4

  # PAN: f4->ds + Y5 -> f5
  - [-1, 1, Conv, [256, 3, 2]]                     # 21
  - [[-1, 11], 1, Concat, [1]]                     # 22  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 23  f5

  - [[17, 20, 23], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 24
# ---- innovation #3: bbox regression loss -----------------------------------
loss_name: focaler_interpiou
loss_params:
  focaler_d: 0.35           # ablation: {0.30, 0.35, 0.40}
  focaler_u: 0.80           # ablation: {0.75, 0.80, 0.85}
  dynamic_interp: true      # false -> static InterpIoU (alpha = 0.99)
