# RT-DETR with DSAWACGAv6 (Wavelet-guided frequency-aware parallel split)
#
# Key innovation over v3:
#   - Parallel DWT decomposition: original features + wavelet frequency info
#   - Low-freq (LL) → Global branch (SE → LL → FLA serial: L1→L2→L3)
#   - High-freq (LH/HL/HH) → Local branch (DSA with high-freq enhancement)
#   - Graceful degradation: if DWT degrades, falls back to v3-like behavior
#
# DSAWACGAv6Block:
#   Stage 1 (Attention):  x' = DSAWACGA_v6_Mixer(Norm1(x)) * β + x
#     Mixer: conv_init→chunk(2) + DWT→[high→Local, low→Global(SE→LL→FLA)]
#            → cat → GELU → SE → ca_conv
#   Stage 2 (FFN):        x'' = DSAWACGA_v6_FFN(Norm2(x')) * γ + x'
#     FFN: Conv1×1→Split4[id,DW3,DW5,DW7]→Cat→GELU→Conv1×1 + residual

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 1, C2f_DSAWACGA_v6, [128]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 1, C2f_DSAWACGA_v6, [256]]      # 4
  - [-1, 1, Conv, [384, 3, 2]]           # 5-P4/16
  - [-1, 1, C2f_DSAWACGA_v6, [384]]      # 6
  - [-1, 1, Conv, [384, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f_DSAWACGA_v6, [384]]      # 8

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]                       # 10
  - [-1, 1, Conv, [256, 1, 1]]                     # 11, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13 input_proj.1
  - [[-2, -1], 1, Concat, [1]]                     # 14
  - [-1, 3, RepC3, [256, 0.5]]                     # 15, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]                     # 16, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 17
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 18 input_proj.0
  - [[-2, -1], 1, Concat, [1]]                     # 19 cat backbone P3
  - [-1, 3, RepC3, [256, 0.5]]                     # X3 (20), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]]                     # 21, downsample_convs.0
  - [[-1, 16], 1, Concat, [1]]                     # 22 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]                     # F4 (23), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]]                     # 24, downsample_convs.1
  - [[-1, 11], 1, Concat, [1]]                     # 25 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]                     # F5 (26), pan_blocks.1

  - [[20, 23, 26], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)