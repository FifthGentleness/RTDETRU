# Independent Decoder experiment: original FSV7, standard AIFI, original loss.
# CIR args: [nc,hidden,queries,points,heads,layers,kappa_max,warmup_epochs,level].
# Only final-layer P3 (level 0) matching-query interpolation changes.
nc: 10
scales:
  l: [1.00, 1.00, 1024]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C2f_DSAWACGA_v5, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C2f_DSAWACGA_v5, [256]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 1, C2f_DSAWACGA_v5, [384]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 3, C2f_DSAWACGA_v5, [384]]
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, false]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, false]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [[2, 4, 16], 1, CCFFP2V7, [256, 128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [[17, 20, 23], 1, RTDETRDecoderCIR, [nc, 256, 300, 4, 8, 3, 0.5, 30, 0]]
