# RT-DETR with DSAWACGAv7 (WaveletModulatedDSA local + Frequency_Convolution global
#   + SE CA + StarFFN)
#
# Key design vs v5:
#   Local:  WaveletModulatedDSA (same as v5)
#   Global: Frequency_Convolution (FourierSR: block-diagonal spectral conv
#           + complex activation + softshrink) replaces FocusedLinearAttention
#   CA:     SE (same as v5)
#   FFN:    StarFFN (same as v5)
#
# Frequency_Convolution vs CSFH FourierUnit:
#   Both use FFT, but different parameterization:
#   - FourierUnit: BN + FPE + grouped conv + softmax on 2×dim
#   - Frequency_Convolution: block-diagonal complex linear on dim
#     + complex ReLU + softshrink (explicit spectral filtering)
#
# DSAWACGAv7Block:
#   Stage 1 (Attention):  x' = DSAWACGA_v7_Mixer(Norm1(x)) * β + x
#     Mixer: conv_init→split→[WaveletModulatedDSA + Frequency_Convolution]→cat→GELU→SE→ca_conv
#   Stage 2 (FFN):        x'' = StarFFN(Norm2(x')) * γ + x'
#     FFN: fc1→[DW3+DW5 gate] * content→fc2+residual

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 1, C2f_DSAWACGA_v7, [128]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 1, C2f_DSAWACGA_v7, [256]]      # 4
  - [-1, 1, Conv, [384, 3, 2]]           # 5-P4/16
  - [-1, 1, C2f_DSAWACGA_v7, [384]]      # 6
  - [-1, 1, Conv, [384, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f_DSAWACGA_v7, [384]]      # 8

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]                       # 10
  - [-1, 1, Conv, [256, 1, 1]]                     # 11, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13 input_proj.1
  - [[-2, -1], 1, Concat, [1]]                     # 14
  - [-1, 3, RepC3, [256, 0.5]]                     # 15, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]                     # 16, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 17
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 18 input_proj.0
  - [[-2, -1], 1, Concat, [1]]                     # 19 cat backbone P3
  - [-1, 3, RepC3, [256, 0.5]]                     # X3 (20), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]]                     # 21, downsample_convs.0
  - [[-1, 16], 1, Concat, [1]]                     # 22 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]                     # F4 (23), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]]                     # 24, downsample_convs.1
  - [[-1, 11], 1, Concat, [1]]                     # 25 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]                     # F5 (26), pan_blocks.1

  - [[20, 23, 26], 1, RTDETRDecoder, [nc]]         # 27