# Dual-scale AIFI: BlockSparse at P5 (V1, unchanged) + BlockSparseV11 at P4.
#
# Rationale: dense AIFI is affordable only at P5 (400 tokens). P4 has 1600
# tokens, so a dense mixer costs 16x more attention pairs. V11's compact
# gather attention (topk=8 -> 9 blocks incl self per query, ~2.25% density)
# makes P4-level global context affordable for the first time in this repo.
#
# Single-variable discipline vs the V1 baseline: the P5 branch is byte-for-
# byte identical to rtdetr-...-AIFI-BlockSparse.yaml; the ONLY change is the
# added P4 AIFI layer (index 14) plus shifted neck indices.

# Parameters
nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 1, C2f_DSAWACGA_v5, [128]]      # 2  P2: 128ch
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 1, C2f_DSAWACGA_v5, [256]]      # 4  P3: 256ch
  - [-1, 1, Conv, [384, 3, 2]]           # 5-P4/16
  - [-1, 1, C2f_DSAWACGA_v5, [384]]      # 6  P4: 384ch
  - [-1, 1, Conv, [384, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f_DSAWACGA_v5, [384]]      # 8  P5: 384ch

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9  P5 proj
  - [-1, 1, AIFI_BlockSparse, [1024, 8]]           # 10 P5 AIFI (V1, unchanged)
  - [-1, 1, Conv, [256, 1, 1]]                     # 11 Y5
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13 P4 proj
  - [-1, 1, AIFI_BlockSparseV11, [1024, 8, 4, 8]]  # 14 P4 AIFI (NEW, topk=8)
  - [[-2, -1], 1, Concat, [1]]                     # 15 256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 16
  - [-1, 1, Conv, [256, 1, 1]]                     # 17 Y4
  - [[2, 4, 17], 1, CCFFP2V7, [256, 128]]          # 18 f3
  - [-1, 1, Conv, [256, 3, 2]]                     # 19
  - [[-1, 17], 1, Concat, [1]]                     # 20 256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 21 f4
  - [-1, 1, Conv, [256, 3, 2]]                     # 22
  - [[-1, 11], 1, Concat, [1]]                     # 23 256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 24 f5
  - [[18, 21, 24], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 25
