# RT-DETR-r18 + DSAWACGAv5 backbone + HybridEncoderP2SPDOKMFSV7 encoder
#
# V7: identity-residual-preserved version of V6
# Key fix: out = x + DCFM(x) + large_kernel + FCA->SCA->FGM + FreqScale
# (vs V6: out = fuse_out(small_fuse([x,DCFM(x)]) + OKNetLK(x) + FreqScale->SCA->FGM(x)))
#
# Channel design (same as V2):
#   P2: 128ch -> Identity (no projection) -> SPDConv(128->128) -> 128ch
#   P3: 256ch -> Identity (no projection, full info preserved) -> 256ch
#   P4: 384ch -> Conv1x1(384->256) -> 256ch
#   P5: 384ch -> Conv1x1(384->256) -> 256ch
#
# CCFFP2V7 data flow:
#   SPDConv(128->128) -> 128ch
#   concat = 128 + 256(P3) + 256(Y4) = 640
#   split(ratio=0.25) -> [innovation 160, identity 480]
#   CCFFBlockV7(160, large_kernel=31, fs_init_scale=1e-2)
#   RepC3(640->256) -> f3: 256ch
#
# CCFFBlockV7 internal:
#   local_enhance = DCFM(x)
#   out = in_conv(x)
#   large_out = dw_1k(out) + dw_k1(out) + dw_kk(out) + dw_11(out)
#   global_out = FCA->SCA->FGM(out) + FreqScale(FGM(out))
#   result = x + local_enhance + large_out + global_out  <- identity residual!

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 1, C2f_DSAWACGA_v5, [128]]      # 2  P2: 128ch
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 1, C2f_DSAWACGA_v5, [256]]      # 4  P3: 256ch
  - [-1, 1, Conv, [384, 3, 2]]           # 5-P4/16
  - [-1, 1, C2f_DSAWACGA_v5, [384]]      # 6  P4: 384ch
  - [-1, 1, Conv, [384, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f_DSAWACGA_v5, [384]]      # 8  P5: 384ch

head:
  # P5: 384->256 (input_proj.2)
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9
  - [-1, 1, AIFI, [1024, 8]]                       # 10
  - [-1, 1, Conv, [256, 1, 1]]                     # 11, Y5

  # FPN: Y5_up + P4_proj -> RepC3 -> Y4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13  P4: 384->256
  - [[-2, -1], 1, Concat, [1]]                     # 14  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 15
  - [-1, 1, Conv, [256, 1, 1]]                     # 16, Y4: 256ch

  # CCFFP2V7: [P2(128ch), P3(256ch), Y4(256ch)] -> f3(256ch)
  # spd_out_ch=128: SPDConv outputs 128 instead of default 256
  - [[2, 4, 16], 1, CCFFP2V7, [256, 128]]          # 17  f3

  # PAN: f3->ds + Y4 -> f4
  - [-1, 1, Conv, [256, 3, 2]]                     # 18
  - [[-1, 16], 1, Concat, [1]]                     # 19  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 20  f4

  # PAN: f4->ds + Y5 -> f5
  - [-1, 1, Conv, [256, 3, 2]]                     # 21
  - [[-1, 11], 1, Concat, [1]]                     # 22  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 23  f5

  - [[17, 20, 23], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 24