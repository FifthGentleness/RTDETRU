# Supervision & Quality-Calibration Track (Base AIFI + Hybrid O2M + Detached IoU Head)
#
# Built strictly on Base AIFI [1024, 8] (mutually exclusive with AIFI_BlockSparse):
#   1. Hybrid O2M Training Group (o2m_queries=300, o2m_weight=0.35, o2m_k=4):
#      - Runs an isolated one-to-many query group (75% F3 small-object grid, 25% F4-F5)
#        in shared decoder layers during training only via 3-way attn_mask isolation.
#      - Small targets (<32px) receive up to o2m_k=4 positive copies, larger targets 2.
#      - Zero inference params / latency overhead (skipped in eval/export).
#   2. Detached Box-Aligned IoU Head (iou_alpha=0.35, iou_weight=1.0):
#      - Samples 9 canonical box-boundary/center points from detached F3 features around
#        final O2O boxes + detached decoder hidden states (zero grad leakage to backbone/decoder).
#      - Calibrates inference scores via p_cls^(1-alpha) * p_iou^alpha while keeping raw logits.
#
# Single-factor ablation toggles (trailing args of RTDETRDecoderHybridIoU):
#   [nc, hd=256, nq=300, ndp=4, nh=8, ndl=3,
#    o2m_queries=300, o2m_weight=0.35, o2m_k=4, iou_alpha=0.35, iou_weight=1.0, warmup_epochs=20]
#   - O2M only:          [..., 300, 0.35, 4, 0.0, 0.0, 20]
#   - DetachedIoU only:  [..., 0,   0.0,  4, 0.35, 1.0, 20]

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 1, C2f_DSAWACGA_v5, [128]]      # 2  P2: 128ch
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 1, C2f_DSAWACGA_v5, [256]]      # 4  P3: 256ch
  - [-1, 1, Conv, [384, 3, 2]]           # 5-P4/16
  - [-1, 1, C2f_DSAWACGA_v5, [384]]      # 6  P4: 384ch
  - [-1, 1, Conv, [384, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f_DSAWACGA_v5, [384]]      # 8  P5: 384ch

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9
  - [-1, 1, AIFI, [1024, 8]]                       # 10 Base AIFI
  - [-1, 1, Conv, [256, 1, 1]]                     # 11 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13 P4: 384->256
  - [[-2, -1], 1, Concat, [1]]                     # 14 256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 15
  - [-1, 1, Conv, [256, 1, 1]]                     # 16 Y4: 256ch

  - [[2, 4, 16], 1, CCFFP2V7, [256, 128]]          # 17 f3

  - [-1, 1, Conv, [256, 3, 2]]                     # 18
  - [[-1, 16], 1, Concat, [1]]                     # 19
  - [-1, 3, RepC3, [256, 0.5]]                     # 20 f4

  - [-1, 1, Conv, [256, 3, 2]]                     # 21
  - [[-1, 11], 1, Concat, [1]]                     # 22
  - [-1, 3, RepC3, [256, 0.5]]                     # 23 f5

  - [[17, 20, 23], 1, RTDETRDecoderHybridIoU, [nc, 256, 300, 4, 8, 3, 300, 0.35, 4, 0.35, 1.0, 20]]  # 24
