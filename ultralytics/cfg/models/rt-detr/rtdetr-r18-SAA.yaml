# RT-DETR-r18 with SAA (Scale-Aware Attentional) backbone from SME-DETR
# New architecture: each stage = DownSample -> Conv1x1 -> Split(Identity + DPF) -> Concat -> Conv1x1
#   - DPF (Dual-Path Fusion) = DSA + DCA
#   - DSA: Conv3x3 -> 5-branch multi-scale DWConv (3,5,7,9,11) + softmax weights -> Conv1x1
#   - DCA: AGAP -> Conv1xK/ConvKx1 (K=11+2n) -> DWConv + PWConv + Sigmoid
#   - X_{l-1}^{(1)}: Identity branch (direct pass-through)
#   - X_{l-1}^{(2)}: DPF branch (DSA + DCA fusion)
#   - Per-stage n: deeper stages use larger n for longer channel dependency
#     Stage 2: n=0 (K=11), Stage 3: n=1 (K=13), Stage 4: n=2 (K=15), Stage 5: n=3 (K=17)

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  - [-1, 1, SAAStage, [64, False, 0]]   # 4        n=0, K=11, no downsample
  - [-1, 1, SAAStage, [128, True, 1]]   # 5-P3/8   n=1, K=13
  - [-1, 1, SAAStage, [256, True, 2]]   # 6-P4/16  n=2, K=15
  - [-1, 1, SAAStage, [512, True, 3]]   # 7-P5/32  n=3, K=17

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 9
  - [-1, 1, Conv, [256, 1, 1]]  # 10, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 12 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 13
  - [-1, 3, RepC3, [256, 0.5]]  # 14, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]   # 15, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 17 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 18 cat backbone P3
  - [-1, 3, RepC3, [256, 0.5]]    # X3 (19), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]]   # 20, downsample_convs.0
  - [[-1, 15], 1, Concat, [1]]  # 21 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]    # F4 (22), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]]   # 23, downsample_convs.1
  - [[-1, 10], 1, Concat, [1]]  # 24 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]    # F5 (25), pan_blocks.1

  - [[19, 22, 25], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)