# RT-DETR-r18 + DSAWACGAv5 backbone + HybridEncoderP2SPDOKMFSV7 encoder + AIFI_mHCPFBSA
#
# Innovation 1 (Backbone): C2f_DSAWACGA_v5 (WaveletModulatedDSA + FocusedLinearAttention + SE + StarFFN)
# Innovation 2 (Neck/CCFF): CCFFP2V7 (P2 SPDConv + DCFM + 31x31 OKNet + FCA->SCA->FGM->FreqScale)
# Innovation 3 (AIFI): AIFI_mHCPFBSA
#   - mHC (DeepSeek 2025 / ICLR 2025 Hyper-Connections): 4-stream Birkhoff-polytope Sinkhorn residual
#   - Progressive Focused Block-Sparse Attention (CVPR 2025 PFA + CVPR 2026 BlockSparse):
#     3-stage progressive focus (stage1 topk=6 blocks -> token topk 16 -> token topk 8)
#   - Mixed-Frequency 2D RoPE (ECCV 2024 RoPE-ViT): 2D relative rotations on Q/K only
#   - SparkConvFFN (NeurIPS 2025 Spark Transformer): 3x3 DWConv + statistical top-k gating (cm=768)

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 1, C2f_DSAWACGA_v5, [128]]      # 2  P2: 128ch
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 1, C2f_DSAWACGA_v5, [256]]      # 4  P3: 256ch
  - [-1, 1, Conv, [384, 3, 2]]           # 5-P4/16
  - [-1, 1, C2f_DSAWACGA_v5, [384]]      # 6  P4: 384ch
  - [-1, 1, Conv, [384, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f_DSAWACGA_v5, [384]]      # 8  P5: 384ch

head:
  # P5: 384->256 (input_proj.2)
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]        # 9
  - [-1, 1, AIFI_mHCPFBSA, [768, 8, 3, 4]]               # 10  [cm, num_heads, num_stages, num_streams]
  - [-1, 1, Conv, [256, 1, 1]]                           # 11, Y5

  # FPN: Y5_up + P4_proj -> RepC3 -> Y4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]           # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]         # 13  P4: 384->256
  - [[-2, -1], 1, Concat, [1]]                           # 14  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                           # 15
  - [-1, 1, Conv, [256, 1, 1]]                           # 16, Y4: 256ch

  # CCFFP2V7: [P2(128ch), P3(256ch), Y4(256ch)] -> f3(256ch)
  - [[2, 4, 16], 1, CCFFP2V7, [256, 128]]                # 17  f3

  # PAN: f3->ds + Y4 -> f4
  - [-1, 1, Conv, [256, 3, 2]]                           # 18
  - [[-1, 16], 1, Concat, [1]]                           # 19  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                           # 20  f4

  # PAN: f4->ds + Y5 -> f5
  - [-1, 1, Conv, [256, 3, 2]]                           # 21
  - [[-1, 11], 1, Concat, [1]]                           # 22  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                           # 23  f5

  - [[17, 20, 23], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 24
