# Repaired P2Proposal (V2): BlockSparse + hd=256 + P2 sparse foreground sampling pool
# + query-level small-object routing + cross-scale deduplicated P2 proposals.
#
# Key fixes over P2Proposal32 (V1):
#   1. Keeps hd=256 and never pushes all 25,600 P2 points into enc_output / enc_score_head.
#   2. Brings foreground-routed P2 (stride-4, top 25% active regions) into EVERY decoder
#      layer's iterative deformable sampling pool via P2SparseDeformAttn.
#   3. Routes only top-96 small-object / foreground matching queries per image to sample P2.
#   4. Applies 3x3 local-peak NMS on P2 + cross-scale IoU>0.65 suppression against F3-F5
#      top-300 boxes so P2 proposal slots target missed/under-covered small objects.
#   5. ground_loss_weight=0.0 keeps zero extra loss term (strictly preserves native RT-DETR
#      loss alongside AIFI_BlockSparse); set last arg to 0.25 only if testing auxiliary loss.
#
# RTDETRDecoderP2ProposalV2 args:
#   [nc, hd=256, nq=300, ndp=4, nh=8, ndl=3,
#    p2_queries=32, p2_dim=128, p2_route_queries=96, p2_fg_ratio=0.25, dedup_iou=0.65, ground_loss_weight=0.0]

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1 P2/4
  - [-1, 1, C2f_DSAWACGA_v5, [128]]      # 2 P2
  - [-1, 1, Conv, [256, 3, 2]]           # 3 P3/8
  - [-1, 1, C2f_DSAWACGA_v5, [256]]      # 4 P3
  - [-1, 1, Conv, [384, 3, 2]]           # 5 P4/16
  - [-1, 1, C2f_DSAWACGA_v5, [384]]      # 6 P4
  - [-1, 1, Conv, [384, 3, 2]]           # 7 P5/32
  - [-1, 3, C2f_DSAWACGA_v5, [384]]      # 8 P5

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9
  - [-1, 1, AIFI_BlockSparse, [1024, 8]]           # 10
  - [-1, 1, Conv, [256, 1, 1]]                     # 11 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13
  - [[-2, -1], 1, Concat, [1]]                     # 14
  - [-1, 3, RepC3, [256, 0.5]]                     # 15
  - [-1, 1, Conv, [256, 1, 1]]                     # 16 Y4

  - [[2, 4, 16], 1, CCFFP2V7, [256, 128]]          # 17 F3
  - [-1, 1, Conv, [256, 3, 2]]                     # 18
  - [[-1, 16], 1, Concat, [1]]                     # 19
  - [-1, 3, RepC3, [256, 0.5]]                     # 20 F4

  - [-1, 1, Conv, [256, 3, 2]]                     # 21
  - [[-1, 11], 1, Concat, [1]]                     # 22
  - [-1, 3, RepC3, [256, 0.5]]                     # 23 F5

  - [[17, 20, 23, 2], 1, RTDETRDecoderP2ProposalV2, [nc, 256, 300, 4, 8, 3, 32, 128, 96, 0.25, 0.65, 0.0]]  # 24
