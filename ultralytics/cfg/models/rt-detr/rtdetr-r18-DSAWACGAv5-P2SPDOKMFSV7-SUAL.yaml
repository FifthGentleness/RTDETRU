# RT-DETR-r18 + DSAWACGAv5 backbone + HybridEncoderP2SPDOKMFSV7 encoder + SUAL Loss
#
# Architecture: IDENTICAL to rtdetr-r18-DSAWACGAv5-P2SPDOKMFSV7.yaml (V7).
# Only the localization loss is replaced, selected through loss_name /
# loss_params and resolved by RTDETRDetectionModel.init_criterion() ->
# ultralytics/utils/loss_plugins -> RTDETRDetectionLossSUAL.
#
# L_SUAL = Scale-Uncertainty-Aware Localization:
#   [1] Scale branch   (SLS, CVPR 2024, Liu et al.):
#       alpha = (min(A_p,A_gt)+dis)/(max(A_p,A_gt)+dis), dis=((A_p-A_gt)/2)^2
#       applied as  1 - alpha * IoU ; plus polar center location penalty
#       (angle + radial ratio), faithful to the official MSHNet code.
#   [2] Uncertainty branch (UGS-inspired, ICCV 2025, parameter-free):
#       SQCL soft-quantized classification-style localization (bounded,
#       saturating gradients), UM inter-layer variance minimization,
#       rho uncertainty reweighting on the IoU term.
#
#   L_SUAL = sum_i w_u_i*(1 - alpha_i*IoU_i)
#          + lambda_L * L_loc_polar + lambda_c * L_SQCL + mu * L_UM
#   w_u_i = 1 + rho * u_hat_i
#
# Classification loss / Hungarian matching / DN plumbing: unchanged.

loss_name: sual
loss_params:
  # --- [1] SLS scale branch ---
  sls_iou: 'giou'         # 'giou' | 'iou' | 'ciou'
  sls_loc_weight: 1.0     # lambda_L (polar location penalty)
  # --- [2] UGS-inspired uncertainty branch ---
  sqcl_bins: 32           # K quantization bins per coordinate
  sqcl_sigma: 1.0         # kernel width (bin units)
  sqcl_nonuniform: 1.0    # gamma; try 2.0 for denser bins near 0 (ablation)
  sqcl_weight: 1.0        # lambda_c
  um_weight: 0.5          # mu
  um_area_ref: 0.01       # ~80px @640
  um_gamma: 0.5
  um_w_max: 4.0
  sual_rho: 1.0           # uncertainty reweighting strength

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 1, C2f_DSAWACGA_v5, [128]]      # 2  P2: 128ch
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 1, C2f_DSAWACGA_v5, [256]]      # 4  P3: 256ch
  - [-1, 1, Conv, [384, 3, 2]]           # 5-P4/16
  - [-1, 1, C2f_DSAWACGA_v5, [384]]      # 6  P4: 384ch
  - [-1, 1, Conv, [384, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f_DSAWACGA_v5, [384]]      # 8  P5: 384ch

head:
  # P5: 384->256 (input_proj.2)
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9
  - [-1, 1, AIFI, [1024, 8]]                       # 10
  - [-1, 1, Conv, [256, 1, 1]]                     # 11, Y5

  # FPN: Y5_up + P4_proj -> RepC3 -> Y4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13  P4: 384->256
  - [[-2, -1], 1, Concat, [1]]                     # 14  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 15
  - [-1, 1, Conv, [256, 1, 1]]                     # 16, Y4: 256ch

  # CCFFP2V7: [P2(128ch), P3(256ch), Y4(256ch)] -> f3(256ch)
  - [[2, 4, 16], 1, CCFFP2V7, [256, 128]]          # 17  f3

  # PAN: f3->ds + Y4 -> f4
  - [-1, 1, Conv, [256, 3, 2]]                     # 18
  - [[-1, 16], 1, Concat, [1]]                     # 19  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 20  f4

  # PAN: f4->ds + Y5 -> f5
  - [-1, 1, Conv, [256, 3, 2]]                     # 21
  - [[-1, 11], 1, Concat, [1]]                     # 22  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 23  f5

  - [[17, 20, 23], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 24
