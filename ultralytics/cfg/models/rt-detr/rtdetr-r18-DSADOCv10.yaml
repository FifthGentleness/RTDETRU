# RT-DETR-r18 with DSADOC_v10 backbone blocks (port of rtdetr_pytorch PResNet_DSADOC_v10)
# DSADOC_v10: DSA (multi-scale spatial + Scharr edge) + DOC (Haar DWT wavelet calibration + FiLM)
#
# Ported 1:1 from rtdetr_pytorch configs/rtdetr/rtdetr_r18vd_6x_visdrone_dsadoc_v10.yml:
#   - Backbone is PResNet-18vd (identical stem/stages as rtdetr-r18.yaml below)
#   - In each of the 4 stages, the LAST BasicBlock has branch2a (3x3) replaced by
#     DSADOC_v10; branch2b and the residual shortcut are unchanged
#   - Channels unchanged: 64/128/256/512, so DSADOC_v10 dim = ch_out, cr = ch_out // 2
#   - Head identical to rtdetr-r18.yaml (P3/P4/P5 -> input_proj -> AIFI -> CCFF -> RTDETRDecoder)

nc: 10  # VisDrone-DET classes
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  # [ch_out, block_type, block_nums, stage_num, act, variant]
  # BlocksDSADOCv10: all blocks vanilla BasicBlock except the LAST one
  # (DSADOC_v10 replaces branch2a), same as rtdetr_pytorch _insert_dsadcc
  - [-1, 1, BlocksDSADOCv10, [64, BasicBlock, 2, 2, 'relu']] # 4
  - [-1, 1, BlocksDSADOCv10, [128, BasicBlock, 2, 3, 'relu']] # 5-P3/8
  - [-1, 1, BlocksDSADOCv10, [256, BasicBlock, 2, 4, 'relu']] # 6-P4/16
  - [-1, 1, BlocksDSADOCv10, [512, BasicBlock, 2, 5, 'relu']] # 7-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 9
  - [-1, 1, Conv, [256, 1, 1]]  # 10, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 12 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 13
  - [-1, 3, RepC3, [256, 0.5]]  # 14, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]   # 15, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 17 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 18 cat backbone P3
  - [-1, 3, RepC3, [256, 0.5]]    # X3 (19), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]]   # 20, downsample_convs.0
  - [[-1, 15], 1, Concat, [1]]  # 21 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]    # F4 (22), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]]   # 23, downsample_convs.1
  - [[-1, 10], 1, Concat, [1]]  # 24 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]    # F5 (25), pan_blocks.1

  - [[19, 22, 25], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)
