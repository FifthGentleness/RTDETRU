# FSV7 with query-conditioned P3 subcell evidence in the P5 encoder.
# Layer 10 reads layer 4 (P3) and layer 9 (projected P5) and emits one P5 map.
# At imgsz=640, each location in the 20x20 P5 grid exposes four 2x2 P3 quadrants.

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 1, C2f_DSAWACGA_v5, [128]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 1, C2f_DSAWACGA_v5, [256]]      # 4
  - [-1, 1, Conv, [384, 3, 2]]           # 5-P4/16
  - [-1, 1, C2f_DSAWACGA_v5, [384]]      # 6
  - [-1, 1, Conv, [384, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f_DSAWACGA_v5, [384]]      # 8

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9
  - [[4, 9], 1, AIFI_P3Subcell, [1024, 8, 64]]      # 10: FFN width, heads, P3 projection width
  - [-1, 1, Conv, [256, 1, 1]]                     # 11, Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13
  - [[-2, -1], 1, Concat, [1]]                     # 14
  - [-1, 3, RepC3, [256, 0.5]]                     # 15
  - [-1, 1, Conv, [256, 1, 1]]                     # 16, Y4

  - [[2, 4, 16], 1, CCFFP2V7, [256, 128]]          # 17, f3

  - [-1, 1, Conv, [256, 3, 2]]                     # 18
  - [[-1, 16], 1, Concat, [1]]                     # 19
  - [-1, 3, RepC3, [256, 0.5]]                     # 20, f4

  - [-1, 1, Conv, [256, 3, 2]]                     # 21
  - [[-1, 11], 1, Concat, [1]]                     # 22
  - [-1, 3, RepC3, [256, 0.5]]                     # 23, f5

  - [[17, 20, 23], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 24
