# RT-DETR-r18 + HybridEncoderP2SPDOKMFSV7 (identity-residual-preserved version of V6)
#
# V7 key fix vs V6:
#   V6: out = fuse_out(small_fuse([x,DCFM(x)]) + OKNetLK(x) + FreqScale->SCA->FGM(x))
#       -> identity residual LOST, x passes through two random 1x1 convs
#   V7: out = x + DCFM(x) + large_kernel + FCA->SCA->FGM + FreqScale
#       -> identity residual RESTORED, x has direct path to output
#
# CCFFP2V7 data flow (R18 backbone):
#   SPDConv(64->128) -> 128ch
#   concat = 128 + 128 + 256 = 512
#   split(ratio=0.25) -> [innovation 128, identity 384]
#   CCFFBlockV7(128, large_kernel=31, fs_init_scale=1e-2)
#   RepC3(512->256) -> f3: 256ch

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 4  P2/4  (64)
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 5  P3/8  (128)
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 6  P4/16 (256)
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 7  P5/32 (512)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 8
  - [-1, 1, AIFI, [1024, 8]] # 9
  - [-1, 1, Conv, [256, 1, 1]] # 10
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 6], 1, Concat, [1]] # 12
  - [-1, 3, RepC3, [256, 0.5]] # 13
  - [-1, 1, Conv, [256, 1, 1]] # 14

  # CCFFP2V7: [P2(64ch), P3(128ch), Y4(256ch)] -> f3(256ch)
  - [[4, 5, 14], 1, CCFFP2V7, [256]] # 15  f3

  - [-1, 1, Conv, [256, 3, 2]] # 16
  - [[-1, 14], 1, Concat, [1]] # 17
  - [-1, 3, RepC3, [256, 0.5]] # 18

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 10], 1, Concat, [1]] # 20
  - [-1, 3, RepC3, [256, 0.5]] # 21

  - [[15, 18, 21], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # 22