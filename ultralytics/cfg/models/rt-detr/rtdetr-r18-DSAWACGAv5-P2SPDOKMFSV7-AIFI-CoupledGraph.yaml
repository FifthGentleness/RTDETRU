# FSV7 + P3/P5 coupled graph refinement after native P5 attention.
# AIFI_CoupledGraph args: [FFN width, heads, graph width, unfolding steps].
# Both output selectors are routing only, in order [encoded P5, refined P3].

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 1, C2f_DSAWACGA_v5, [128]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 1, C2f_DSAWACGA_v5, [256]]      # 4
  - [-1, 1, Conv, [384, 3, 2]]           # 5-P4/16
  - [-1, 1, C2f_DSAWACGA_v5, [384]]      # 6
  - [-1, 1, Conv, [384, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f_DSAWACGA_v5, [384]]      # 8

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 9, projected P5
  - [[4, 9], 1, AIFI_CoupledGraph, [1024, 8, 64, 4]] # 10
  - [10, 1, GetIndexOutput, [1]]                     # 11, refined P3
  - [10, 1, GetIndexOutput, [0]]                     # 12, encoded P5
  - [-1, 1, Conv, [256, 1, 1]]                      # 13, Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]       # 14
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]    # 15, projected P4
  - [[-2, -1], 1, Concat, [1]]                      # 16
  - [-1, 3, RepC3, [256, 0.5]]                      # 17
  - [-1, 1, Conv, [256, 1, 1]]                      # 18, Y4

  - [[2, 11, 18], 1, CCFFP2V7, [256, 128]]          # 19, f3

  - [-1, 1, Conv, [256, 3, 2]]                      # 20
  - [[-1, 18], 1, Concat, [1]]                      # 21
  - [-1, 3, RepC3, [256, 0.5]]                      # 22, f4

  - [-1, 1, Conv, [256, 3, 2]]                      # 23
  - [[-1, 13], 1, Concat, [1]]                      # 24
  - [-1, 3, RepC3, [256, 0.5]]                      # 25, f5

  - [[19, 22, 25], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 26
