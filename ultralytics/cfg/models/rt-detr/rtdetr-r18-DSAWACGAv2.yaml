# RT-DETR-r18 with DSAWACGAv2 backbone blocks (DSAWACGA without cross_gate)
# DSAWACGAv2: DSA (multi-scale spatial + Scharr edge) + WACGA (wavelet-aware
# convolutional gating attention), fused by DIRECT concat + Conv1x1+BN+SiLU
#
# Based on rtdetr-r18-DSAWACGA.yaml, single change:
#   - cross_gate (Conv1x1 + Sigmoid global gating) REMOVED:
#     fdsa and fwacga are concatenated directly into dsawacga_fusion,
#     letting the 1x1 fusion layer handle cross-channel interaction
#   - Same rationale as DSADOC_v11 vs v10: global gating is spatial-blind
#     (harmful for small objects), redundant with the 1x1 fusion layer,
#     and Sigmoid(0,1) is purely inhibitory
#   - ~174K params removed (2*cr^2 per stage, cr = ch_out//2)
#
# Everything else identical to rtdetr-r18-DSAWACGA.yaml:
#   - Backbone PResNet-18vd; in each of the 4 stages the LAST BasicBlock has
#     branch2a replaced by DSAWACGAv2; branch2b and shortcut unchanged
#   - Channels unchanged: 64/128/256/512, DSAWACGAv2 dim = ch_out, cr = ch_out // 2
#   - Head identical to rtdetr-r18.yaml (P3/P4/P5 -> input_proj -> AIFI -> CCFF -> RTDETRDecoder)

nc: 10  # VisDrone-DET classes
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  # [ch_out, block_type, block_nums, stage_num, act, variant]
  # BlocksDSAWACGAv2: all blocks vanilla BasicBlock except the LAST one
  # (DSAWACGAv2 replaces branch2a, cross_gate removed -> direct 1x1 fusion)
  - [-1, 1, BlocksDSAWACGAv2, [64, BasicBlock, 2, 2, 'relu']] # 4
  - [-1, 1, BlocksDSAWACGAv2, [128, BasicBlock, 2, 3, 'relu']] # 5-P3/8
  - [-1, 1, BlocksDSAWACGAv2, [256, BasicBlock, 2, 4, 'relu']] # 6-P4/16
  - [-1, 1, BlocksDSAWACGAv2, [512, BasicBlock, 2, 5, 'relu']] # 7-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 9
  - [-1, 1, Conv, [256, 1, 1]]  # 10, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 12 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 13
  - [-1, 3, RepC3, [256, 0.5]]  # 14, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]   # 15, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 17 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 18 cat backbone P3
  - [-1, 3, RepC3, [256, 0.5]]    # X3 (19), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]]   # 20, downsample_convs.0
  - [[-1, 15], 1, Concat, [1]]  # 21 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]    # F4 (22), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]]   # 23, downsample_convs.1
  - [[-1, 10], 1, Concat, [1]]  # 24 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]    # F5 (25), pan_blocks.1

  - [[19, 22, 25], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)
