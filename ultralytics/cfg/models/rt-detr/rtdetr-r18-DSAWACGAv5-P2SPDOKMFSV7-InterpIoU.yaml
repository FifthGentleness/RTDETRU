# RT-DETR-r18 + DSAWACGAv5 backbone + HybridEncoderP2SPDOKMFSV7 encoder
# + Pure InterpIoU bbox regression loss (NO Inner-IoU term)
#
# loss_name: interpiou
#   Pure InterpIoU / D-InterpIoU bbox regression loss
#   (Liu & Watanabe, "InterpIoU: Robust bounding box regression loss within an
#   interpolation-based IoU framework", Neurocomputing 666 (2026) 132230;
#   official code: https://github.com/NuayHL/interpiou)
#
#       B_i     = (1 - alpha) * B + alpha * B_gt        (interpolated box)
#       InterpIoU = IoU(B, B_gt) + IoU(B_i, B_gt) - 1
#       L_giou    = 1 - InterpIoU
#
#   Variants (official defaults):
#       InterpIoU   : fixed alpha = interp_coe (paper: 0.98)
#       D-InterpIoU : per-sample alpha = clamp(1 - IoU, lv, hv)
#
#   L1 / VFL / Hungarian matching / aux & denoising losses: unchanged
#   No Inner-IoU auxiliary term is involved.
#
# Hyperparameters (small-object defaults):
#   dynamic_interp = true  : D-InterpIoU main term (recommended);
#                            false -> static InterpIoU with alpha = interp_coe
#   interp_coe      = 0.98 : fixed interpolation coefficient (static variant)
#   lv / hv        = 0.6 / 0.99 : dynamic coefficient clamp bounds
nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 1, C2f_DSAWACGA_v5, [128]]      # 2  P2: 128ch
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 1, C2f_DSAWACGA_v5, [256]]      # 4  P3: 256ch
  - [-1, 1, Conv, [384, 3, 2]]           # 5-P4/16
  - [-1, 1, C2f_DSAWACGA_v5, [384]]      # 6  P4: 384ch
  - [-1, 1, Conv, [384, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f_DSAWACGA_v5, [384]]      # 8  P5: 384ch

head:
  # P5: 384->256 (input_proj.2)
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9
  - [-1, 1, AIFI, [1024, 8]]                       # 10
  - [-1, 1, Conv, [256, 1, 1]]                     # 11, Y5

  # FPN: Y5_up + P4_proj -> RepC3 -> Y4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 13  P4: 384->256
  - [[-2, -1], 1, Concat, [1]]                     # 14  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 15
  - [-1, 1, Conv, [256, 1, 1]]                     # 16, Y4: 256ch

  # CCFFP2V7: [P2(128ch), P3(256ch), Y4(256ch)] -> f3(256ch)
  # spd_out_ch=128: SPDConv outputs 128 instead of default 256
  - [[2, 4, 16], 1, CCFFP2V7, [256, 128]]          # 17  f3

  # PAN: f3->ds + Y4 -> f4
  - [-1, 1, Conv, [256, 3, 2]]                     # 18
  - [[-1, 16], 1, Concat, [1]]                     # 19  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 20  f4

  # PAN: f4->ds + Y5 -> f5
  - [-1, 1, Conv, [256, 3, 2]]                     # 21
  - [[-1, 11], 1, Concat, [1]]                     # 22  256+256=512
  - [-1, 3, RepC3, [256, 0.5]]                     # 23  f5

  - [[17, 20, 23], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 24
# ---- bbox regression loss (pure InterpIoU, no Inner-IoU) --------------------
loss_name: interpiou
loss_params:
  dynamic_interp: true      # true -> D-InterpIoU; false -> static InterpIoU
  interp_coe: 0.98          # fixed interpolation coefficient (static variant)
  lv: 0.6                   # D-InterpIoU lower bound
  hv: 0.99                  # D-InterpIoU upper bound
