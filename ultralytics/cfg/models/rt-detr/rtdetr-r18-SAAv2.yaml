# RT-DETR with RAAv2 (CSP-style Scale-Aware Attentional Backbone v2)
# Architecture: YOLO-style Stem + 4 CSP-style Stages
#   - Stem: Conv k=3 s=2 (3->32), P1/2
#   - Each Stage: DownSample -> Conv -> Split -> [Identity, DPF] -> Concat -> Fuse
#   - DPF (Dual-Path Fusion) = DSA + DCA (unchanged from RAA/SAA)
#   - DSA: Conv3x3 -> 5-branch multi-scale DWConv (3,5,7,9,11) + softmax weights -> Conv1x1
#   - DCA: AGAP -> Conv1xK/ConvKx1 (K=11+2n) -> DWConv + PWConv + Sigmoid
#   - Per-stage n: deeper stages use larger n for longer channel dependency
#     Stage 1: n=0 (K=11), Stage 2: n=1 (K=13), Stage 3: n=2 (K=15), Stage 4: n=3 (K=17)
#   - Outputs: F1(S2,/4), F2(S3,/8), F3(S4,/16), F4(S5,/32)

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [32, 3, 2]] # 0-P1/2  Stem

  - [-1, 1, RAAStagev2, [64, 0]]  # 1-P2/4  F1 (S2), n=0, K=11
  - [-1, 1, RAAStagev2, [128, 1]] # 2-P3/8  F2 (S3), n=1, K=13
  - [-1, 1, RAAStagev2, [256, 2]] # 3-P4/16 F3 (S4), n=2, K=15
  - [-1, 1, RAAStagev2, [512, 3]] # 4-P5/32 F4 (S5), n=3, K=17

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 5 input_proj.2
  - [-1, 1, AIFI, [1024, 8]] # 6
  - [-1, 1, Conv, [256, 1, 1]]  # 7, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 8
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 10
  - [-1, 3, RepC3, [256, 0.5]]  # 11, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]   # 12, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 14 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 15 cat backbone P3
  - [-1, 3, RepC3, [256, 0.5]]    # X3 (16), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]]   # 17, downsample_convs.0
  - [[-1, 12], 1, Concat, [1]]  # 18 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]    # F4 (19), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]]   # 20, downsample_convs.1
  - [[-1, 7], 1, Concat, [1]]  # 21 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]    # F5 (22), pan_blocks.1

  - [[16, 19, 22], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)