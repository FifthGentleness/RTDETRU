# FSV7 with layer-2 P3 context and layer-3 P3 boundary readout.
# Backbone, standard AIFI and fusion are the original FSV7.

nc: 10
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C2f_DSAWACGA_v5, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C2f_DSAWACGA_v5, [256]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 1, C2f_DSAWACGA_v5, [384]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 3, C2f_DSAWACGA_v5, [384]]

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [[2, 4, 16], 1, CCFFP2V7, [256, 128]]  # 17, f3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]  # 20, f4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]  # 23, f5
  - [[17, 20, 23], 1, RTDETRDecoderP3EdgeRead, [nc, 256, 300, 4, 8, 3,
      {use_context: true, proj_dim: 32, stride: 8, min_side_px: 4.0, max_size_px: 48.0,
       max_radius_px: 4.0, max_offset_px: 2.0, max_strength: 0.25,
       max_context_strength: 0.15}]]  # 24
